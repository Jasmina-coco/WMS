# Production: bitta EC2 dagi Docker Swarm.
#   docker stack deploy -c docker-stack.yml wms
#
# WEB_IMAGE, NGINX_IMAGE, SCALER_IMAGE va CONF_VERSION ni serverdagi
# deploy agenti (deploy/agent/omborhub-deploy.sh) beradi.

x-logging: &cloudwatch
  # Konteyner loglari to'g'ridan-to'g'ri CloudWatch Logs ga ketadi (EC2 IAM role orqali)
  driver: awslogs
  options:
    awslogs-region: ap-southeast-2
    awslogs-group: /wms/app
    awslogs-create-group: "true"
    tag: "{{.Name}}"

services:
  nginx:
    image: ${NGINX_IMAGE}
    ports:
      # mode: host — foydalanuvchining haqiqiy IP manzili Nginx'ga yetib keladi
      - { target: 80, published: 80, mode: host }
      - { target: 443, published: 443, mode: host }
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks: [app]
    logging: *cloudwatch
    deploy:
      replicas: 1
      # Host portlarni ikki konteyner bir vaqtda egallay olmaydi, shuning uchun avval eskisi to'xtaydi
      update_config: { order: stop-first }
      restart_policy: { condition: any }
      resources:
        limits: { memory: 64M }

  web:
    image: ${WEB_IMAGE}
    env_file: /opt/omborhub/.env
    networks: [app]
    logging: *cloudwatch
    deploy:
      replicas: 2
      # Rolling update: yangi konteyner ishga tushib, healthcheck'dan o'tgandan
      # keyingina eskisi o'chiriladi. Sayt yangilanish paytida to'xtamaydi.
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy: { condition: any, delay: 5s }
      resources:
        limits: { cpus: "0.5", memory: 200M }

  autoscaler:
    image: ${SCALER_IMAGE}
    environment:
      SERVICE_NAME: wms_web
      # t3.micro da 1 GB xotira bor — 3 tadan ortiq replika sig'maydi
      MIN_REPLICAS: "2"
      MAX_REPLICAS: "3"
      SCALE_UP_CPU: "70"
      SCALE_DOWN_CPU: "25"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *cloudwatch
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits: { memory: 48M }

configs:
  nginx_conf:
    # Swarm config o'zgarmas, shuning uchun har deployda nomi yangilanadi
    name: nginx_conf_${CONF_VERSION}
    file: ./prod.conf

networks:
  app:
    driver: overlay
