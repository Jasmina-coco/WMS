# Lokal (docker compose) uchun: faqat HTTP.
# `docker compose up --scale web=3` qilsangiz, Nginx so'rovlarni uchala konteynerga taqsimlaydi.

resolver 127.0.0.11 valid=10s ipv6=off;

upstream django {
    zone django 64k;
    least_conn;
    # "resolve" — konteynerlar soni o'zgarsa, Nginx yangi IP larni o'zi topadi
    server web:8000 resolve;
}

server {
    listen 80;
    client_max_body_size 12m;

    location /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Qaysi konteyner javob berganini ko'rish uchun (load balancing namoyishi)
        add_header X-Served-By $upstream_addr always;
    }
}
