# Serverdagi Nginx: HTTPS, load balancing va statik fayllar.
# Domen: vangogh.uz (www va eski wms.vangogh.uz ham shu yerga yo'naltiriladi).
# Sertifikat Let's Encrypt (certbot) orqali olinadi.

# Docker Swarm ichki DNS serveri
resolver 127.0.0.11 valid=10s ipv6=off;

upstream django {
    zone django 64k;
    # Eng kam band konteynerga yuboriladi
    least_conn;
    # tasks.web — Swarm'dagi barcha web replikalarining IP ro'yxati.
    # Autoscaler replika qo'shsa yoki olib tashlasa, Nginx 10 soniyada bilib oladi.
    # Bitta xato replikani darhol o'chirib qo'ymasin: 3 marta xato bo'lsagina 5 soniyaga chetlatiladi
    server tasks.web:8000 resolve max_fails=3 fail_timeout=5s;
    keepalive 16;
    # Gunicorn keepalive (75 s) dan qisqa — ulanishni doim Nginx o'zi yopadi
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name vangogh.uz www.vangogh.uz wms.vangogh.uz;

    # certbot sertifikatni yangilashda shu papkadan foydalanadi
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://vangogh.uz$request_uri;
    }
}

ssl_certificate /etc/letsencrypt/live/vangogh.uz/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/vangogh.uz/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:5m;

# www va wms subdomenlari asosiy domenga yo'naltiriladi
server {
    listen 443 ssl;
    http2 on;
    server_name www.vangogh.uz wms.vangogh.uz;
    return 301 https://vangogh.uz$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name vangogh.uz;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 12m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /health/ {
        access_log off;
        proxy_pass http://django;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Bitta replika javob bermasa, so'rov keyingisiga yuboriladi
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        add_header X-Served-By $upstream_addr always;
    }
}
