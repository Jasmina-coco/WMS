# CI/CD
#
# Har bir push va pull request:  lint -> testlar
# main branchga push bo'lganda:   + Docker image'lar yig'iladi va GHCR ga yuklanadi
#                                 + server yangi versiyani o'rnatganini tekshiramiz
#
# Deploy "pull" usulida: serverdagi agent (deploy/agent) har daqiqada GHCR ni
# tekshirib, yangi image chiqsa o'zini yangilaydi. Shuning uchun GitHub'da
# AWS yoki SSH kaliti saqlanmaydi.
#
# Repo variable: DEPLOY_URL=https://vangogh.uz (bo'lmasa verify bosqichi o'tkazib yuboriladi)

name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Formatlash (black)
        run: black --check .
      - name: Kod sifati (flake8)
        run: flake8

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wms
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: wms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wms"
          --health-interval 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only
      DB_NAME: wms
      DB_USER: wms
      DB_PASSWORD: wms
      DB_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migratsiyalar unutilmaganini tekshirish
        run: python manage.py makemigrations --check --dry-run
      - name: Testlar
        run: python manage.py test

  build:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      prefix: ${{ steps.vars.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        # GHCR faqat kichik harflarni qabul qiladi
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          build-args: APP_VERSION=${{ github.sha }}
          push: true
          tags: ${{ steps.vars.outputs.prefix }}/wms-web:${{ github.sha }},${{ steps.vars.outputs.prefix }}/wms-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: nginx
          push: true
          tags: ${{ steps.vars.outputs.prefix }}/wms-nginx:${{ github.sha }},${{ steps.vars.outputs.prefix }}/wms-nginx:latest
          cache-from: type=gha
      - name: autoscaler image
        uses: docker/build-push-action@v6
        with:
          context: deploy/autoscaler
          push: true
          tags: ${{ steps.vars.outputs.prefix }}/wms-autoscaler:${{ github.sha }},${{ steps.vars.outputs.prefix }}/wms-autoscaler:latest

  verify:
    # Server yangi versiyani o'rnatib, ishlayotganini tasdiqlaguncha kutamiz
    needs: build
    if: vars.DEPLOY_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: /health/ da yangi versiya chiqishini kutish
        env:
          URL: ${{ vars.DEPLOY_URL }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 80); do
            BODY=$(curl -fsS "$URL/health/" || true)
            echo "$BODY"
            if echo "$BODY" | grep -q "\"version\": \"$SHA\""; then
              echo "Deploy muvaffaqiyatli: $SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Server yangi versiyaga o'tmadi"
          exit 1
