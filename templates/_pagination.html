{% load i18n wms %}
{% if is_paginated %}
<div class="pagination">
  {% if page_obj.has_previous %}<a class="btn btn-sm" href="?{% query_with page=page_obj.previous_page_number %}">&larr;</a>{% endif %}
  <span class="muted small">{% blocktranslate with n=page_obj.number total=page_obj.paginator.num_pages %}{{ n }} / {{ total }}-sahifa{% endblocktranslate %}</span>
  {% if page_obj.has_next %}<a class="btn btn-sm" href="?{% query_with page=page_obj.next_page_number %}">&rarr;</a>{% endif %}
</div>
{% endif %}
