{% load i18n %}
{% get_current_language as LANG %}
<form action="{% url 'set_language' %}" method="post" class="lang-switch">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" name="language" value="uz" class="{% if LANG == 'uz' %}active{% endif %}">UZ</button>
  <button type="submit" name="language" value="ru" class="{% if LANG == 'ru' %}active{% endif %}">RU</button>
</form>
