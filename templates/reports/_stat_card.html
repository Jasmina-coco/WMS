{% if link %}<a class="card stat-card{% if warn %} warn{% endif %}" href="{% url 'reports:report' link %}">{% else %}<div class="card stat-card{% if warn %} warn{% endif %}">{% endif %}
  <div class="stat-label">{{ label }}</div>
  <div class="stat-value">{{ card.value }}</div>
  <div class="stat-sub">{{ sub_label }}: {{ card.sub }}</div>
{% if link %}</a>{% else %}</div>{% endif %}
