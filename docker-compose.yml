# Lokal ishga tushirish:
#   docker compose up --build
#   docker compose up --build --scale web=3   (load balancingni ko'rish uchun)
# Sayt: http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wms
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: wms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: web }
    image: wms-web:local
    env_file: .env
    environment: &db_env
      DB_HOST: db
      DB_NAME: wms
      DB_USER: wms
      DB_PASSWORD: wms
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    command: python manage.py migrate --noinput
    depends_on:
      db: { condition: service_healthy }

  web:
    image: wms-web:local
    env_file: .env
    environment: *db_env
    depends_on:
      migrate: { condition: service_completed_successfully }

  nginx:
    build: { context: ., target: nginx }
    ports:
      - "8080:80"
    depends_on:
      - web

volumes:
  pgdata:
